[project]
name = "rent-agent"
version = "0.1.0"
description = "AI-powered rental contract review agent using DSPy"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dspy-ai>=3.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
exclude = ["src/notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["rent_agent"]

[tool.ruff.lint.per-file-ignores]
"src/rent_agent/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
packages = ["rent_agent"]
mypy_path = "src"
exclude = ["src/notebooks"]

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
